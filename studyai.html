<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudyAI – Smart Learning with AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store" />-+

  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333;}
    header{background:#1e88e5;color:#fff;padding:20px;text-align:center;}
    header h1{margin:0;}
    nav{
      background:#1565c0;
      padding:10px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    nav a{
      color:#fff;
      margin:0 10px;
      text-decoration:none;
      font-weight:bold;
    }
    .right{display:flex;align-items:center;}
    .profile{
      font-size:22px;
      cursor:pointer;
      margin-left:15px;
    }
    .container{padding:30px;max-width:1100px;margin:auto;}
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:20px;
    }
    .card{
      background:#fff;
      padding:25px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-align:center;
      cursor:pointer;
      transition:0.2s;
    }
    .card:hover{transform:scale(1.05);}
    .card h3{color:#1e88e5;}
    .ask-box{
      margin-top:50px;
      background:#fff;
      padding:25px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
    textarea{width:100%;height:100px;padding:10px;font-size:16px;}
    button{
      margin-top:10px;
      padding:10px 20px;
      background:#1e88e5;
      color:#fff;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }
    button:hover{background:#0d47a1;}
    footer{
      background:#1e88e5;
      color:#fff;
      text-align:center;
      padding:15px;
      margin-top:50px;
    }
  </style>
</head>

<body>

<header>
  <h1>StudyAI</h1>
  <p>Smart Learning with AI (SSC • NEET • JEE)</p>
</header>

<nav>
  <div>
    <a href="studyai.html">Home</a>
    <a href="#" onclick="openCourse('ssc')">SSC</a>
    <a href="#" onclick="openCourse('neet')">NEET</a>
    <a href="#" onclick="openCourse('jee')">JEE</a>
  </div>

  <div class="right" id="authArea">
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </div>

  <div class="right" id="profileArea" style="display:none;">
    <span class="profile" onclick="openAccount()">👤</span>
  </div>
</nav>

<div class="container">
  <h2>Choose Your Exam</h2>

  <div class="cards">
    <div class="card" onclick="openCourse('ssc')">
      <h3>SSC</h3>
      <p>Reasoning, Math, GK, English</p>
    </div>

    <div class="card" onclick="openCourse('neet')">
      <h3>NEET</h3>
      <p>Physics, Chemistry, Biology</p>
    </div>

    <div class="card" onclick="openCourse('jee')">
      <h3>JEE</h3>
      <p>Physics, Chemistry, Math</p>
    </div>
  </div>

  <div class="ask-box">
    <h2>Ask StudyAI</h2>
    <textarea id="question" placeholder="Type your question in English..."></textarea>
    <button onclick="answer()">Ask AI</button>
    <p id="response" style="margin-top:15px;"></p>
  </div>
</div>

<footer>
  <p>© 2026 StudyAI | Made in India 🇮🇳</p>
</footer>
<script>
// 🔐 AUTH UI CONTROL
window.addEventListener("pageshow", function(){
  const student = JSON.parse(localStorage.getItem("student"));

  if(student){
    document.getElementById("authArea").style.display = "none";
    document.getElementById("profileArea").style.display = "flex";
  } else {
    document.getElementById("authArea").style.display = "flex";
    document.getElementById("profileArea").style.display = "none";
  }
});

// 👤 PROFILE
function openAccount(){
  window.location.href = "account.html";
}

// 📚 COURSE LOGIC
function openCourse(course){
  const student = JSON.parse(localStorage.getItem("student"));

  if(student){
    window.location.href = course + ".html"; // ⭐ DIRECT PAGE OPEN
  } else {
    localStorage.setItem("selectedCourse", course);
    window.location.href = "login.html";
  }
}

// 🤖 AI PART
async function answer(){
  const q = document.getElementById("question").value;
  if(q.trim() === ""){
    alert("Type a question");
    return;
  }

  document.getElementById("response").innerText =
    "🤖 StudyAI is thinking...";

  try{
    const res = await fetch("http://localhost:3000/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ question: q })
    });

    const data = await res.json();
    document.getElementById("response").innerText = data.answer;
  }
  catch(err){
    document.getElementById("response").innerText =
      "❌ Server not responding";
  }
}
</script>


</body>
</html>
