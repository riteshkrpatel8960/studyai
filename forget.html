<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>StudyAI - Forgot Password</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  border-radius:10px;
  width:350px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
input{
  width:100%;
  height:44px;
  margin:10px 0;
  padding:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:10px;
  background:#1e88e5;
  color:#fff;
  border:none;
  cursor:pointer;
}
#msg{color:red;margin-top:10px;}
</style>
</head>

<body>

<div class="box">
<h2>Forgot Password</h2>

<input type="email" id="email" placeholder="Enter your email">
<button onclick="sendOTP()">Send OTP</button>

<p id="msg"></p>
</div>

<script>

// ⭐ Email auto fill from login.html
window.onload = function(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");
  if(email){
    document.getElementById("email").value = email;
  }
}

async function sendOTP(){
   alert("Button clicked");

  const email = document.getElementById("email").value.trim().toLowerCase();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if(!email){
    msg.innerText = "Enter email";
    return;
  }

  try{
    const res = await fetch("/forgot-password",{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if(data.message){
      alert("OTP sent to email 📩");

      // ⭐ Reset page pe email pass
      window.location.href = "reset.html?email="+encodeURIComponent(email);
    }else{
      msg.innerText = "Failed to send OTP";
    }

  }catch(err){
    msg.innerText = "Server error";
  }
}
</script>

</body>
</html>
