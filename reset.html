<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyAI - Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#fff;
  padding:30px;
  border-radius:10px;
  width:350px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-align:center;
}
h2{color:#1e88e5;}

input{
  width:100%;
  height:44px;
  padding:10px;
  margin:10px 0;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:10px;
  background:#1e88e5;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
  border-radius:5px;
}
button:hover{background:#0d47a1;}

#msg{color:red;margin-top:10px;}

/* 👁️ PASSWORD BOX SAME AS LOGIN */
.password-box{
  position: relative;
  width:100%;
  margin:10px 0;
}
.password-box input{
  width:100%;
  height:44px;
  padding:10px;
  padding-right:45px;
  font-size:16px;
  box-sizing:border-box;
}
.toggle-eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#555;
}
</style>

</head>

<body>

<div class="box">
<h2>Reset Password</h2>

<input type="email" id="email" placeholder="Email">
<input type="text" id="otp" placeholder="Enter OTP">

<div class="password-box">
  <input type="password" id="newPass" placeholder="New Password">

<svg class="toggle-eye" id="eyeIcon" onclick="togglePassword()"
    width="20" height="20" viewBox="0 0 24 24"
    fill="none" stroke="#555" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"> <path d="M2 12s4-4 10-4 10 4 10 4"/> <path d="M6 16l-1 2"/> <path d="M10 16v2"/> <path d="M14 16v2"/> <path d="M18 16l1 2"/> </svg>

</div>

<button onclick="resetPass()">Reset Password</button>

<p id="msg"></p>
</div>

<script>
async function resetPass() {

  const email = document.getElementById("email").value.trim().toLowerCase();
  const otp = document.getElementById("otp").value.trim();
  const newPassword = document.getElementById("newPass").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if(!email || !otp || !newPassword){
    msg.innerText = "All fields required";
    return;
  }

  const res = await fetch("http://localhost:3000/reset-password", {
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({
      email,
      otp,
      newPassword
    })
  });

  const data = await res.json();

  if(data.message === "Password reset successful"){
    alert("Password Updated ✅");
    window.location.href = "login.html";
  }else{
    msg.innerText = data.message || "Reset failed";
  }
}

// 👁️ SHOW / HIDE PASSWORD
function togglePassword(){
  const pwd = document.getElementById("newPass");
  const eye = document.getElementById("eyeIcon");

  if(pwd.type === "password"){
    pwd.type = "text";
    eye.style.stroke = "#1e88e5";
  }else{
    pwd.type = "password";
    eye.style.stroke = "#555";
  }
}

// ⭐ EMAIL AUTO FILL
window.onload = function(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");
  if(email){
    document.getElementById("email").value = email;
  }
}
</script>

</body>
</html>
