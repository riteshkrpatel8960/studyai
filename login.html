<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudyAI - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f4f6f8;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box{
      background:#fff;
      padding:30px;
      border-radius:10px;
      width:350px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-align:center;
    }
    h2{color:#1e88e5;}
    
    button{
      width:100%;
      padding:10px;
      background:#1e88e5;
      color:#fff;
      border:none;
      font-size:16px;
      cursor:pointer;
      border-radius:5px;
    }
    button:hover{background:#0d47a1;}
    p{margin-top:15px;}
    a{color:#1e88e5;text-decoration:none;}
    #msg{color:red;margin-top:10px;}


.password-box{
  position: relative;
  width:100%;
  margin:10px 0;
}

.password-box input{
  width:100%;
  height:44px;              /* SAME HEIGHT */
  padding:10px;
  padding-right:45px;       /* eye icon space */
  font-size:16px;
  box-sizing:border-box;
}

.toggle-eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  color:#555;
}



  </style>
</head>

<body>

<div class="box">
  <h2>Login to StudyAI</h2>

  <!-- 🔥 FORM (IMPORTANT) -->
  <form id="loginForm">
   <div class="password-box">
  <input type="email" id="email" placeholder="Email" required>
</div>

  <div class="password-box">
  <input type="password" id="password" placeholder="Password" required>
<svg class="toggle-eye" id="eyeIcon" onclick="togglePassword()"
     width="20" height="20" viewBox="0 0 24 24"
     fill="none" stroke="#555" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- eyelid -->
  <path d="M2 12s4-4 10-4 10 4 10 4"/>
  <!-- lashes -->
  <path d="M6 16l-1 2"/>
  <path d="M10 16v2"/>
  <path d="M14 16v2"/>
  <path d="M18 16l1 2"/>
</svg>

</div>



    <button type="submit">Login</button>
  </form>

<p id="accountText">New user?
  <a href="signup.html" id="createAccount">Create account</a>
</p>



  <p id="msg"></p>
</div>

<!-- 🔥 SINGLE & CORRECT LOGIN SCRIPT -->
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

 const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if(email === "" || password === ""){
    msg.innerText = "All fields are required";
    return;
  }

  try{
    const res = await fetch("http://localhost:3000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    console.log("LOGIN RESPONSE:", data);

    if(data.status === "ok"){
      document.getElementById("accountText").innerHTML =
  `New user? <a href="signup.html" id="createAccount">Create account</a>`;

      // ✅ MONGO LOGIN DATA SAVE
      localStorage.setItem("student", JSON.stringify({
        id: data.userId,
        name: data.name,
        email: data.email
      }));

      window.location.href = "course.html";
    } 
    else {

  if(data.msg && data.msg === "Invalid password"){

    msg.innerText = "Wrong password ❌";

    // Create account hide
    document.getElementById("createAccount").style.display = "none";

    // Same jagah Forget Password show
    document.getElementById("accountText").innerHTML =
  `Forgot password? <a href="forget.html?email=${encodeURIComponent(email)}">Reset here</a>`;

  }
  else{
    msg.innerText = data.msg || "Invalid email or password";
  }

}


  }catch(err){
    console.error(err);
    msg.innerText = "Server not responding";
  }
});
</script>
<script>
document.getElementById("email").addEventListener("input", ()=>{
  document.getElementById("accountText").innerHTML =
    `New user? <a href="signup.html" id="createAccount">Create account</a>`;
});
</script>


<script>
function togglePassword(){
  const pwd = document.getElementById("password");
  const eye = document.getElementById("eyeIcon");

  if(pwd.type === "password"){
    pwd.type = "text";
    eye.style.stroke = "#1e88e5"; // blue = visible
  }else{
    pwd.type = "password";
    eye.style.stroke = "#555"; // grey = hidden
  }
}
</script>



</body>
</html>
