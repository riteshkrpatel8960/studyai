<!DOCTYPE html>
<html>
<head>
  <title>StudyAI – NEET Exam Center</title>
  <style>
    body {
      font-family: Arial;
      background:#f2f4f8;
      padding:20px;
      text-align:center;
    }
    .box {
      max-width:700px;
      background:white;
      padding:30px;
      margin:auto;
      border-radius:10px;
      box-shadow:0 0 10px #ccc;
    }
    h1 { color:#2e7d32; }
    button {
      width:100%;
      padding:15px;
      margin-top:15px;
      font-size:18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }
    .free { background:#4caf50; color:white; }
    .neet { background:#e53935; color:white; }
  </style>
</head>

<body>

<div class="box">
  <h1>🧬 NEET Exam Center</h1>
  <p>Select your test mode</p>

  <button class="free" onclick="openFree()">🟢 Free AI Practice</button>
  <button class="neet" onclick="openNeet()">🔴 NEET Preparation (₹99)</button>
</div>

<script>
function openFree(){
  window.location.href = "neetai.html";
}

function openNeet(){
  localStorage.setItem("examLevel","neet");
  window.location.href = "payment.html";
}
</script>


</body>
</html>
